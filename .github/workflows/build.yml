name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  dua-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: cache
        uses: actions/cache@v4
        with:
          path: app/audio/duas
          key: dua-audio-v2-${{ hashFiles('app/js/duas.js', 'tools/gen-dua-audio.py') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate spoken Arabic clips with Piper
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet piper-tts==1.2.0
          V=https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium
          curl -sSfL -o /tmp/voice.onnx "$V/ar_JO-kareem-medium.onnx"
          curl -sSfL -o /tmp/voice.onnx.json "$V/ar_JO-kareem-medium.onnx.json"
          node -e "console.log(JSON.stringify(require('./app/js/duas.js')))" > /tmp/duas.json
          python tools/gen-dua-audio.py /tmp/duas.json /tmp/voice.onnx app/audio/duas
          for f in app/audio/duas/*.wav; do
            ffmpeg -loglevel error -y -i "$f" -ac 1 -codec:a libmp3lame -b:a 48k "${f%.wav}.mp3"
            rm "$f"
          done
          test -z "$(ls app/audio/duas/*.wav 2>/dev/null)"
          test "$(ls app/audio/duas/*.mp3 | wc -l)" -ge 60
          ls -la app/audio/duas | head -5; du -sh app/audio/duas
      - uses: actions/upload-artifact@v4
        with:
          name: dua-audio
          path: app/audio/duas

  windows:
    needs: [test, dua-audio]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: dua-audio
          path: app/audio/duas
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Sakina-Windows-installer
          path: dist/*.exe

  android:
    needs: [test, dua-audio]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: dua-audio
          path: app/audio/duas
      - name: Set up Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools" && mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - run: npm ci
      - run: npm run sync
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Sakina-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sakina-Android-apk
          path: mobile/Sakina-debug.apk
